<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%">
  <defs>
    <linearGradient id="sqGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2c38" />
      <stop offset="100%" stop-color="#0f171e" />
    </linearGradient>
    <radialGradient id="kingGlow" cx="82%" cy="18%" r="45%">
      <stop offset="0%" stop-color="#d49a18" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#d49a18" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldCrown" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>

  <!-- Tactical Board Tile Squircle -->
  <rect width="48" height="48" rx="10" fill="url(#sqGrad)" />
  <rect x="1" y="1" width="46" height="46" rx="9" fill="none" stroke="#476274" stroke-width="1.2" stroke-opacity="0.8" />

  <!-- Enemy King Radiant Aura (Top Right) -->
  <circle cx="38" cy="11" r="11" fill="url(#kingGlow)" />

  <!-- Enemy King Crown & Cross -->
  <g transform="translate(33, 4) scale(0.65)">
    <!-- Crown Cross -->
    <path d="M7 1v4M5 3h4" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" />
    <!-- Crown Base -->
    <path d="M1 10l3-5 3 2.5 3-2.5 3 5H1z" fill="url(#goldCrown)" stroke="#18232c" stroke-width="1" stroke-linejoin="round" />
    <circle cx="1" cy="5" r="1" fill="#fef3c7" />
    <circle cx="7" cy="2.5" r="1" fill="#fef3c7" />
    <circle cx="13" cy="5" r="1" fill="#fef3c7" />
  </g>

  <!-- Classic Chess Knight Silhouette -->
  <g transform="translate(2, 4) scale(0.92)" stroke="#121d28" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Knight Mane & Back -->
    <path
      d="M 22,10 C 32.5,11 38.5,18 38,39 L 15,39 C 15,30 25,32.5 23,18"
      fill="#f8fafc"
    />
    <!-- Knight Face, Muzzle & Chest -->
    <path
      d="M 24,18 C 24.38,20.91 18.45,25.37 16,27 C 13,29 13.18,31.34 11,31 C 9.958,30.06 12.41,27.96 11,28 C 10,28 11.19,29.23 10,30 C 9,30 5.997,31 6,26 C 6,24 12,14 12,14 C 12,14 13.89,12.1 14,10.5 C 13.27,9.506 13.5,8.5 14.5,8 C 16.5,8 18.5,10.5 18.5,10.5 C 18.5,10.5 20.95,9.309 22,10 z"
      fill="#f8fafc"
    />
    <!-- Nostril -->
    <circle cx="9" cy="25.5" r="0.8" fill="#121d28" stroke="none" />
    <!-- Eye -->
    <path
      d="M 15 15.5 A 0.6 1.4 0 1 1 14,15.5 A 0.6 1.4 0 1 1 15 15.5 z"
      transform="matrix(0.866,0.5,-0.5,0.866,9.693,-5.173)"
      fill="#121d28"
      stroke="none"
    />
  </g>
</svg>